name: Otonom Freelance Ajan Taramasi (Sabah & Aksam)

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-freelance-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Depoyu Cek (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Kutuphaneleri Yukle
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ajanlari 30 Dakika Calistir
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_GONDEREN: ${{ secrets.GMAIL_GONDEREN }}
          GMAIL_UYGULAMA_SIFRESI: ${{ secrets.GMAIL_UYGULAMA_SIFRESI }}
          RAPOR_ALICI_EMAIL: ${{ secrets.RAPOR_ALICI_EMAIL }}
        run: python freelance_hunters.py

      - name: Veritabanini (seen_jobs.db) Depoya Kaydet
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_jobs.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otonom tarama: seen_jobs.db guncellendi" && git push)
