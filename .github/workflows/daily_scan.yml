name: Otonom Freelance Ajan Taramasi (Sabah & Aksam)

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-freelance-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Depoyu Cek (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Kutuphaneleri Yukle
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ajanlari 30 Dakika Calistir ve Web Sayfasini Uret
        env:
          GEMINI_API_KEY: ${{ secrets.AQ.Ab8RN6KJRZ-GZ7vrL57WFIOq7QKSDn30XSY2-s5EYsL_ECanjQ }}
        run: python freelance_hunters.py

      - name: Veritabani ve Web Sayfasini (index.html) Yayinla
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_jobs.db index.html jobs_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otonom tarama: Web panosu guncellendi" && git push)
